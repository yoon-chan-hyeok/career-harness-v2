<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">자소서코치</title>
  <desc id="desc">내 경험의 근거에서, 나다운 문장까지. Career Harness V2 공개 설계 소개.</desc>
  <rect width="1280" height="360" rx="20" fill="#0040d9"/>
  <g fill="#fff" font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif">
    <text x="60" y="57" font-size="13" font-weight="700" letter-spacing="2.2">CAREER HARNESS V2</text>
    <text x="60" y="157" font-size="65" font-weight="800" letter-spacing="-3">자소서코치</text>
    <text x="63" y="210" font-size="25" font-weight="500" letter-spacing="-.7">내 경험의 근거에서, 나다운 문장까지.</text>
    <path d="M63 250H699" stroke="#fff" stroke-opacity=".4"/>
    <text x="63" y="292" font-size="14">회사 이해</text><text x="160" y="292" font-size="14">경험의 근거</text><text x="278" y="292" font-size="14">사용자의 선택</text>
    <circle cx="146" cy="287" r="2"/><circle cx="264" cy="287" r="2"/>
    <text x="63" y="329" font-size="11" letter-spacing="1.3" opacity=".85">PRODUCT INTENT / SYSTEM DESIGN / USER JOURNEY</text>
  </g>
  <g transform="translate(827 57)">
    <rect x="15" y="12" width="350" height="260" rx="11" fill="#002ea5" stroke="#6791ff"/>
    <rect x="0" y="0" width="350" height="260" rx="11" fill="#fff"/>
    <g font-family="Malgun Gothic,Noto Sans KR,Arial,sans-serif">
      <rect x="26" y="26" width="99" height="24" rx="4" fill="#ebf1ff"/>
      <text x="39" y="42" font-size="10" font-weight="700" fill="#0040d9">COACH'S NOTE</text>
      <text x="26" y="88" font-size="22" font-weight="700" fill="#101522">문장 앞에, 내 경험.</text>
      <path d="M27 108H321" stroke="#d5dce8"/>
      <g font-size="15" fill="#354156">
        <text x="53" y="146">어떤 일을 해냈나요?</text>
        <text x="53" y="183">무엇으로 설명할 수 있나요?</text>
        <text x="53" y="220">이 회사와 어떻게 이어질까요?</text>
      </g>
      <g fill="#0040d9"><circle cx="32" cy="140" r="4"/><circle cx="32" cy="177" r="4"/><circle cx="32" cy="214" r="4"/></g>
    </g>
  </g>
</svg>
